apiVersion: v1
kind: ServiceAccount
metadata:
  name: school-onboarder-sa
  namespace: argo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflow-synchronization-limits
  namespace: argo
data:
  llm-batch-lock: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: school-onboarder-argo-role
  namespace: argo
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitops-repo-creds", "dvc-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: school-onboarder-argo-binding
  namespace: argo
subjects:
  - kind: ServiceAccount
    name: school-onboarder-sa
    namespace: argo
roleRef:
  kind: Role
  name: school-onboarder-argo-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: school-onboarder-cluster-role
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: school-onboarder-cluster-binding
subjects:
  - kind: ServiceAccount
    name: school-onboarder-sa
    namespace: argo
roleRef:
  kind: ClusterRole
  name: school-onboarder-cluster-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: onboard-school-tenant
spec:
  serviceAccountName: school-onboarder-sa
  entrypoint: onboard-pipeline
  arguments:
    parameters:
      - name: school_slug
        description: "DNS-safe lowercase identifier with hyphens, e.g., school-frankfurt"
      - name: school_domain
        description: "Ingress hostname, e.g., frankfurt.langlearn.local"
      - name: default_level
        value: "A2"
      - name: admin_email
        value: "admin@school.de"

  templates:
    - name: onboard-pipeline
      dag:
        tasks:
          - name: commit-tenant-gitops
            template: gitops-commit-step
            arguments:
              parameters:
                - name: school_slug
                  value: "{{workflow.parameters.school_slug}}"
                - name: school_domain
                  value: "{{workflow.parameters.school_domain}}"
                - name: default_level
                  value: "{{workflow.parameters.default_level}}"

          - name: wait-for-silo-ready
            dependencies: [commit-tenant-gitops]
            template: wait-namespace-ready-step
            arguments:
              parameters:
                - name: school_slug
                  value: "{{tasks.commit-tenant-gitops.outputs.parameters.normalized_slug}}"

          - name: seed-reading-text-pool
            dependencies: [wait-for-silo-ready]
            template: seed-text-pool-step
            arguments:
              parameters:
                - name: school_slug
                  value: "{{tasks.commit-tenant-gitops.outputs.parameters.normalized_slug}}"

          - name: prewarm-initial-exams
            dependencies: [seed-reading-text-pool]
            template: generate-exam-batch-step
            arguments:
              parameters:
                - name: school_slug
                  value: "{{tasks.commit-tenant-gitops.outputs.parameters.normalized_slug}}"
                - name: level
                  value: "{{workflow.parameters.default_level}}"
                - name: paper_count
                  value: "3"

          - name: send-welcome-email
            dependencies: [prewarm-initial-exams]
            template: notify-admin-step
            arguments:
              parameters:
                - name: school_slug
                  value: "{{tasks.commit-tenant-gitops.outputs.parameters.normalized_slug}}"

    - name: gitops-commit-step
      inputs:
        parameters:
          - name: school_slug
          - name: school_domain
          - name: default_level
      outputs:
        parameters:
          - name: normalized_slug
            valueFrom:
              path: /tmp/normalized_slug.txt
      container:
        image: alpine/git:2.45.2
        command: [sh, -c]
        args:
          - |
            set -e
            # Normalize underscores/uppercase to valid Kubernetes DNS-1123 namespace slug
            SLUG=$(printf '%s' "{{inputs.parameters.school_slug}}" | tr '[:upper:]_' '[:lower:]-')
            printf '%s' "$SLUG" > /tmp/normalized_slug.txt
            echo "Onboarding tenant namespace: $SLUG"
            git clone "https://x-access-token:${GIT_TOKEN}@github.com/rickdevma100/lang-learn-gitops.git" /tmp/gitops
            cd /tmp/gitops
            mkdir -p "environments/tenants/${SLUG}"
            cat <<EOF > "environments/tenants/${SLUG}/values.yaml"
            namespace: ${SLUG}

            ingress:
              enabled: true
              ingressClassName: public
              host: {{inputs.parameters.school_domain}}

            sharedPlatform:
              namespace: lang-learn-platform
              fallbackNamespace: lang-learn
              inferenceUrl: "http://lang-learn-inference-predictor.lang-learn.svc.cluster.local"
              externalLlmUrl: "http://192.168.2.1:9090"

            cronWorkflow:
              enabled: true
              schedule: "0 2 * * *"
              targetLevel: "{{inputs.parameters.default_level}}"
              minPendingPapers: 5
            EOF
            git config user.name "Argo Onboarding Bot"
            git config user.email "bot@langlearn.local"
            git add .
            git diff --staged --quiet || git commit -m "feat(tenant): onboard ${SLUG}"
            git push origin main
        env:
          - name: GIT_TOKEN
            valueFrom:
              secretKeyRef:
                name: gitops-repo-creds
                key: token

    - name: wait-namespace-ready-step
      inputs:
        parameters:
          - name: school_slug
      container:
        image: alpine:3.20
        command: [sh, -c]
        args:
          - |
            set -e
            apk add --no-cache kubectl >/dev/null
            echo "Waiting for Argo CD to create namespace {{inputs.parameters.school_slug}}..."
            for i in $(seq 1 40); do
              if kubectl get ns "{{inputs.parameters.school_slug}}" >/dev/null 2>&1; then
                break
              fi
              sleep 10
            done
            kubectl rollout status deployment/redis-stack -n "{{inputs.parameters.school_slug}}" --timeout=240s
            kubectl rollout status deployment/lang-learn-api -n "{{inputs.parameters.school_slug}}" --timeout=240s
            kubectl rollout status deployment/frontend -n "{{inputs.parameters.school_slug}}" --timeout=240s

    - name: seed-text-pool-step
      inputs:
        parameters:
          - name: school_slug
      container:
        image: ghcr.io/rickdevma100/inference:latest
        command: [python, -c]
        env:
          - name: REDIS_HOST
            value: "redis-stack.{{inputs.parameters.school_slug}}.svc.cluster.local"
          - name: REDIS_PORT
            value: "6379"
        args:
          - |
            from src.exam.text_pool import TextPool
            pool = TextPool()
            seeded = pool.seed_pool(force=False)
            print("Seeded school pool:", seeded)

    - name: generate-exam-batch-step
      synchronization:
        semaphore:
          configMapKeyRef:
            name: workflow-synchronization-limits
            key: llm-batch-lock
      inputs:
        parameters:
          - name: school_slug
          - name: level
          - name: paper_count
      container:
        image: ghcr.io/rickdevma100/inference:latest
        command: [python, -c]
        env:
          - name: REDIS_HOST
            value: "redis-stack.{{inputs.parameters.school_slug}}.svc.cluster.local"
          - name: REDIS_PORT
            value: "6379"
          - name: EXTERNAL_LLM_URL
            value: "http://192.168.2.1:9090"
        args:
          - |
            import asyncio
            from src.exam.orchestrator import ExamOrchestrator
            orch = ExamOrchestrator()
            async def main():
                for i in range(int("{{inputs.parameters.paper_count}}")):
                    p_lesen = await orch.generate_paper(module="lesen", level="{{inputs.parameters.level}}")
                    print(f"Generated Lesen paper {i+1}: {p_lesen['paper_id']}")
                    p_schreiben = await orch.generate_paper(module="schreiben", level="{{inputs.parameters.level}}")
                    print(f"Generated Schreiben paper {i+1}: {p_schreiben['paper_id']}")
            asyncio.run(main())

    - name: notify-admin-step
      inputs:
        parameters:
          - name: school_slug
      container:
        image: python:3.11-slim
        command: [python, -c]
        args:
          - |
            print("Onboarding complete for {{inputs.parameters.school_slug}} at https://{{workflow.parameters.school_domain}}")

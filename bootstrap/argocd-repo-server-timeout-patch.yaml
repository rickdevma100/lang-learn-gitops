# Apply after Argo CD upgrades:
# kubectl patch deployment argocd-repo-server -n argocd --patch-file bootstrap/argocd-repo-server-timeout-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          env:
            - name: ARGOCD_EXEC_TIMEOUT
              value: 300s

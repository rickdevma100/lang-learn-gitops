apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-policies
  namespace: argocd
spec:
  project: lang-learn
  source:
    repoURL: https://github.com/rickdevma100/lang-learn-gitops
    targetRevision: main
    path: platform/kyverno-policies
  destination:
    server: https://kubernetes.default.svc
    namespace: lang-learn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-workflows
  namespace: argocd
spec:
  project: lang-learn
  source:
    repoURL: https://github.com/rickdevma100/lang-learn-gitops
    targetRevision: main
    path: platform/workflows
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

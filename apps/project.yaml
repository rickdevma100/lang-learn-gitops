apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lang-learn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Language Learning MLOps Platform Project"

  # Repositories allowed for this project
  sourceRepos:
    - "ghcr.io/rickdevma100/charts"
    - "https://github.com/rickdevma100/lang-learn-gitops"
    - "https://github.com/rickdevma100/lang-learn-helm-charts"
    - "https://github.com/rickdevma100/lang-learn-monitoring"
    - "https://prometheus-community.github.io/helm-charts"
    - "https://grafana.github.io/helm-charts"
    - "https://argoproj.github.io/argo-helm"
    - "https://charts.min.io/"

  # Destination clusters and namespaces allowed
  destinations:
    - server: "https://kubernetes.default.svc"
      namespace: "lang-learn"
    - server: "https://kubernetes.default.svc"
      namespace: "lang-learn-platform"
    - server: "https://kubernetes.default.svc"
      namespace: "school-*"
    - server: "https://kubernetes.default.svc"
      namespace: "monitoring"
    - server: "https://kubernetes.default.svc"
      namespace: "argo"
    - server: "https://kubernetes.default.svc"
      namespace: "argo-events"
    - server: "https://kubernetes.default.svc"
      namespace: "kube-system"

  # Cluster-scoped resources allowed
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRole
    - group: "rbac.authorization.k8s.io"
      kind: ClusterRoleBinding
    - group: "apiextensions.k8s.io"
      kind: CustomResourceDefinition
    - group: "kyverno.io"
      kind: ClusterPolicy
    - group: "argoproj.io"
      kind: ClusterWorkflowTemplate
    - group: "admissionregistration.k8s.io"
      kind: MutatingWebhookConfiguration
    - group: "admissionregistration.k8s.io"
      kind: ValidatingWebhookConfiguration

  # Namespace-scoped resources allowed
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Roles and RBAC for this project
  roles:
    - name: read-only
      description: "Read-only access to lang-learn applications"
      policies:
        - p, proj:lang-learn:read-only, applications, get, lang-learn/*, allow
    - name: admin
      description: "Full management access to lang-learn applications"
      policies:
        - p, proj:lang-learn:admin, applications, *, lang-learn/*, allow
